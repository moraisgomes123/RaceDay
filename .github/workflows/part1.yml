name: RaceDay Part 1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-project:
    name: Validate RaceDay Part 1
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: |
          test -f README.md
          echo "README.md found"

      - name: Check docs folder
        run: |
          test -d docs
          echo "docs folder found"

      - name: Check ERD
        run: |
          test -f docs/RaceDay_ERD.png.png
          echo "RaceDay_ERD.png found"

      - name: Check API Endpoint Plan
        run: |
          test -f docs/API_Endpoint_Plan.md
          echo "API_Endpoint_Plan.md found"

      - name: Check SQL Database Script
        run: |
          test -f docs/RaceDayDB.sql
          echo "RaceDay_Database.sql found"

      - name: Validate SQL file is not empty
        run: |
          test -s docs/RaceDayDB.sql
          echo "SQL script is not empty"

      - name: Validate API plan is not empty
        run: |
          test -s docs/API_Endpoint_Plan.md
          echo "API Endpoint Plan is not empty"

      - name: Validate ERD file
        run: |
          file docs/RaceDay_ERD.png.png
          echo "ERD file checked"

      - name: Part 1 validation completed
        run: |
          echo "========================================="
          echo "RaceDay Part 1 validation successful"
          echo "========================================="
